openapi: 3.1.0
info:
  title: Pullwise GitHub Project Ledger API
  version: 0.1.0-draft
  description: |
    Target contract for the replacement ledger. S01-S05 provide identity,
    billing, API keys, current profile and repository authorization; project,
    expense and report routes begin at S06. Web uses its same-origin /api proxy; direct
    clients call these paths on the Server Worker. All private responses are
    Cache-Control: no-store. Money is grouped by currency without conversion.
servers:
  - url: /
security:
  - cookieSession: []
  - bearerKey: []
tags:
  - name: Ledger
  - name: Reports
paths:
  /api/v1/me:
    get:
      operationId: getLedgerMe
      x-pullwise-scope: profile:read
      responses:
        '200': {description: Current identity, ledger capabilities and entitlements, content: {application/json: {schema: {$ref: '#/components/schemas/Me'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
  /api/v1/repositories:
    get:
      operationId: listLedgerRepositories
      x-pullwise-scope: projects:read
      parameters: [{$ref: '#/components/parameters/Cursor'}, {$ref: '#/components/parameters/Limit'}]
      responses:
        '200': {description: Current GitHub App authorized repositories, content: {application/json: {schema: {$ref: '#/components/schemas/RepositoryPage'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '502': {description: Invalid bounded GitHub response; error code GITHUB_RESPONSE_INVALID}
        '503': {description: GitHub temporarily unavailable, rate limited, or credential decryption/configuration failure; no automatic retry or token refresh}
  /api/v1/projects:
    get:
      operationId: listLedgerProjects
      x-pullwise-scope: projects:read
      parameters: [{$ref: '#/components/parameters/Cursor'}, {$ref: '#/components/parameters/Limit'}, {$ref: '#/components/parameters/From'}, {$ref: '#/components/parameters/To'}]
      responses:
        '200': {description: Owner projects and per-currency totals, content: {application/json: {schema: {$ref: '#/components/schemas/ProjectPage'}}}}
        '401': {$ref: '#/components/responses/Unauthorized'}
    post:
      operationId: createLedgerProject
      x-pullwise-scope: projects:write
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ProjectInput'}}}}
      responses:
        '429': {$ref: '#/components/responses/RateLimited'}
        '201': {description: Created project, content: {application/json: {schema: {$ref: '#/components/schemas/Project'}}}}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/InvalidInput'}
  /api/v1/projects/{id}:
    parameters: [{$ref: '#/components/parameters/Id'}]
    get:
      operationId: getLedgerProject
      x-pullwise-scope: projects:read
      responses:
        '200': {description: Project, including authorization state and totals, content: {application/json: {schema: {$ref: '#/components/schemas/Project'}}}}
        '404': {$ref: '#/components/responses/NotFound'}
    patch:
      operationId: updateLedgerProject
      x-pullwise-scope: projects:write
      parameters: [{$ref: '#/components/parameters/IfMatch'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ProjectPatch'}}}}
      responses:
        '429': {$ref: '#/components/responses/RateLimited'}
        '200': {description: Updated project, content: {application/json: {schema: {$ref: '#/components/schemas/Project'}}}}
        '404': {$ref: '#/components/responses/NotFound'}
        '412': {$ref: '#/components/responses/PreconditionFailed'}
  /api/v1/categories:
    get:
      operationId: listExpenseCategories
      x-pullwise-scope: categories:read
      responses:
        '200': {description: Account categories including archived entries, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/Category'}}}}}
    post:
      operationId: createExpenseCategory
      x-pullwise-scope: categories:write
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CategoryInput'}}}}
      responses:
        '429': {$ref: '#/components/responses/RateLimited'}
        '201': {description: Created category, content: {application/json: {schema: {$ref: '#/components/schemas/Category'}}}}
        '422': {$ref: '#/components/responses/InvalidInput'}
  /api/v1/categories/{id}:
    parameters: [{$ref: '#/components/parameters/Id'}]
    patch:
      operationId: updateExpenseCategory
      x-pullwise-scope: categories:write
      parameters: [{$ref: '#/components/parameters/IfMatch'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/CategoryInput'}}}}
      responses:
        '429': {$ref: '#/components/responses/RateLimited'}
        '200': {description: Updated category, content: {application/json: {schema: {$ref: '#/components/schemas/Category'}}}}
        '404': {$ref: '#/components/responses/NotFound'}
        '412': {$ref: '#/components/responses/PreconditionFailed'}
    delete:
      operationId: archiveExpenseCategory
      x-pullwise-scope: categories:write
      description: Archive only; existing expenses retain their category reference.
      parameters: [{$ref: '#/components/parameters/IfMatch'}]
      responses:
        '429': {$ref: '#/components/responses/RateLimited'}
        '204': {description: Archived}
        '404': {$ref: '#/components/responses/NotFound'}
        '412': {$ref: '#/components/responses/PreconditionFailed'}
  /api/v1/expenses:
    get:
      operationId: listExpenses
      x-pullwise-scope: expenses:read
      parameters: [{$ref: '#/components/parameters/Target'}, {$ref: '#/components/parameters/ProjectId'}, {$ref: '#/components/parameters/CategoryId'}, {$ref: '#/components/parameters/From'}, {$ref: '#/components/parameters/To'}, {$ref: '#/components/parameters/Currency'}, {$ref: '#/components/parameters/Cursor'}, {$ref: '#/components/parameters/Limit'}]
      responses:
        '200': {description: Active expenses only, content: {application/json: {schema: {$ref: '#/components/schemas/ExpensePage'}}}}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      operationId: createExpense
      x-pullwise-scope: expenses:write
      description: |
        Max automatically receives Jev assistance within this ordinary write, for
        Cookie sessions and expenses:write API keys alike. categoryId may be omitted
        on create: a confident existing account category is then selected. Explicit
        categories, targets, money and dates are never changed by inference. If a
        category cannot be selected, 422 CATEGORY_REQUIRED preserves the draft and
        returns assistance for manual completion. Provider failure or exhausted Jev
        budget does not block a write with an explicit category. Idempotent replay
        returns the stored result without another model call or budget reservation.
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ExpenseInput'}}}}
      responses:
        '429': {$ref: '#/components/responses/RateLimited'}
        '201': {description: Created expense or exact idempotent replay, content: {application/json: {schema: {$ref: '#/components/schemas/Expense'}}}}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/InvalidInput'}
  /api/v1/expenses/export:
    get:
      operationId: exportExpenses
      x-pullwise-scope: expenses:read
      description: Uses list filters; active records only. CSV cells must escape spreadsheet formulas.
      parameters: [{$ref: '#/components/parameters/Target'}, {$ref: '#/components/parameters/ProjectId'}, {$ref: '#/components/parameters/CategoryId'}, {$ref: '#/components/parameters/From'}, {$ref: '#/components/parameters/To'}, {$ref: '#/components/parameters/Currency'}]
      responses:
        '200': {description: Streamed CSV, content: {text/csv: {schema: {type: string}}}}
  /api/v1/expenses/{id}:
    parameters: [{$ref: '#/components/parameters/Id'}]
    get:
      operationId: getExpense
      x-pullwise-scope: expenses:read
      responses:
        '200': {description: Active expense, content: {application/json: {schema: {$ref: '#/components/schemas/Expense'}}}}
        '404': {$ref: '#/components/responses/NotFound'}
    patch:
      operationId: updateExpense
      x-pullwise-scope: expenses:write
      description: Moving an expense checks write authority on both old and new targets. Max gets automatic advisory assistance; categoryId remains required and existing values are never changed by inference.
      parameters: [{$ref: '#/components/parameters/IfMatch'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ExpensePatchInput'}}}}
      responses:
        '429': {$ref: '#/components/responses/RateLimited'}
        '200': {description: Updated expense, content: {application/json: {schema: {$ref: '#/components/schemas/Expense'}}}}
        '404': {$ref: '#/components/responses/NotFound'}
        '412': {$ref: '#/components/responses/PreconditionFailed'}
        '422': {$ref: '#/components/responses/InvalidInput'}
    delete:
      operationId: removeExpense
      x-pullwise-scope: expenses:write
      description: Soft delete and audit event; immediately excluded from list, export and reports.
      parameters: [{$ref: '#/components/parameters/IfMatch'}]
      responses:
        '429': {$ref: '#/components/responses/RateLimited'}
        '204': {description: Removed or already removed by the same owner}
        '404': {$ref: '#/components/responses/NotFound'}
        '412': {$ref: '#/components/responses/PreconditionFailed'}
  /api/v1/reports/summary:
    get:
      operationId: getLedgerSummary
      x-pullwise-scope: reports:read
      parameters: [{$ref: '#/components/parameters/Target'}, {$ref: '#/components/parameters/ProjectId'}, {$ref: '#/components/parameters/CategoryId'}, {$ref: '#/components/parameters/From'}, {$ref: '#/components/parameters/To'}, {$ref: '#/components/parameters/Currency'}]
      responses:
        '200': {description: Separate project, shared and account totals by currency, content: {application/json: {schema: {$ref: '#/components/schemas/Report'}}}}
  /api/v1/reports/timeseries:
    get:
      operationId: getLedgerTimeseries
      x-pullwise-scope: reports:read
      parameters: [{$ref: '#/components/parameters/Target'}, {$ref: '#/components/parameters/ProjectId'}, {$ref: '#/components/parameters/CategoryId'}, {$ref: '#/components/parameters/From'}, {$ref: '#/components/parameters/To'}, {$ref: '#/components/parameters/Currency'}, {name: bucket, in: query, schema: {type: string, enum: [day, month]}}]
      responses:
        '200': {description: Per-currency date buckets, content: {application/json: {schema: {$ref: '#/components/schemas/Report'}}}}
  /api/v1/reports/categories:
    get:
      operationId: getLedgerCategoriesReport
      x-pullwise-scope: reports:read
      parameters: [{$ref: '#/components/parameters/Target'}, {$ref: '#/components/parameters/ProjectId'}, {$ref: '#/components/parameters/CategoryId'}, {$ref: '#/components/parameters/From'}, {$ref: '#/components/parameters/To'}, {$ref: '#/components/parameters/Currency'}]
      responses:
        '200': {description: Per-currency category buckets including historical archived categories, content: {application/json: {schema: {$ref: '#/components/schemas/Report'}}}}
  /api/v1/expense-suggestions:
    post:
      operationId: suggestExpense
      x-pullwise-scope: suggestions:use
      description: Advanced draft advice only; ordinary expense writes already include Max assistance without this endpoint or its scope. Never writes an expense. Disabled unless evaluated and enabled. Shares the account limit of 20 attempts per UTC day and monthly Jev reservation with automatic assistance.
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [purpose, target], properties: {purpose: {type: string, maxLength: 500}, note: {type: string, maxLength: 4000}, occurredOn: {type: string, format: date}, amount: {type: string, description: Decimal amount in selected currency}, currency: {type: string, pattern: "^[A-Z]{3}$"}, target: {$ref: '#/components/schemas/Target'}}}}}}
      responses:
        '200': {description: Status, optional suggestionId, candidates and probabilities; never an expense write, content: {application/json: {schema: {type: object, properties: {status: {type: string, enum: [available, uncertain, unavailable]}, suggestionId: {type: string}, questionVersion: {type: string}, modelVersion: {type: [string, 'null']}, suggestions: {type: object, properties: {categoryId: {type: string}, targetKind: {type: string}, duplicateExpenseId: {type: string}}}, probabilities: {type: object}}}}}}
        '403': {$ref: '#/components/responses/Forbidden'}
        '429': {description: Account rate or daily/monthly suggestion budget exhausted}
  /api/v1/expense-suggestions/{id}/decision:
    post:
      operationId: recordExpenseSuggestionDecision
      x-pullwise-scope: suggestions:use
      description: Record the user's selected category and target after reviewing a suggestion; never writes an expense.
      parameters: [{$ref: '#/components/parameters/Id'}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [categoryId, target], properties: {categoryId: {type: string}, target: {$ref: '#/components/schemas/Target'}}}}}}
      responses:
        '429': {$ref: '#/components/responses/RateLimited'}
        '204': {description: Decision recorded}
        '403': {$ref: '#/components/responses/Forbidden'}
components:
  securitySchemes:
    cookieSession: {type: apiKey, in: cookie, name: pw_session}
    bearerKey: {type: http, scheme: bearer, bearerFormat: 'pwk_ API key'}
  parameters:
    Id: {name: id, in: path, required: true, schema: {type: string}}
    IfMatch: {name: If-Match, in: header, required: true, schema: {type: string}, description: Quoted revision ETag}
    IdempotencyKey: {name: Idempotency-Key, in: header, required: true, schema: {type: string, minLength: 1, maxLength: 128}}
    Target: {name: target, in: query, schema: {type: string, enum: [all, project, shared], default: all}}
    ProjectId: {name: projectId, in: query, schema: {type: string}}
    CategoryId: {name: categoryId, in: query, schema: {type: string}}
    From: {name: from, in: query, schema: {type: string, format: date}, description: Inclusive business date}
    To: {name: to, in: query, schema: {type: string, format: date}, description: Exclusive business date}
    Currency: {name: currency, in: query, schema: {type: string, pattern: '^[A-Z]{3}$'}}
    Cursor: {name: cursor, in: query, schema: {type: string}}
    Limit: {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 50}}
  responses:
    Unauthorized: {description: Authentication required}
    Forbidden: {description: Scope, target, GitHub authorization or plan capacity insufficient}
    NotFound: {description: Resource absent or belongs to another account}
    Conflict: {description: Idempotency conflict or a quota window changed; reload before retrying}
    PreconditionFailed: {description: Revision does not match If-Match}
    InvalidInput: {description: Invalid or missing field. CATEGORY_REQUIRED on create may include top-level assistance when Max inference cannot confidently select an existing category. No expense is saved in that case.}
    RateLimited: {description: Account write rate, monthly write allowance or Jev budget exhausted}
  schemas:
    Me:
      type: object
      required: [id, scopes, entitlements]
      properties:
        id: {type: string}
        scopes: {type: array, items: {type: string}}
        entitlements: {$ref: '#/components/schemas/Entitlements'}
    Entitlements:
      type: object
      required: [plan, limits, jev]
      properties:
        plan: {type: string, enum: [free, pro, max]}
        limits:
          type: object
          required: [projects, expenseRecords, writesPerMinute, writesPerMonth]
          properties:
            projects: {type: integer, minimum: 1}
            expenseRecords: {type: integer, minimum: 1, description: Stored records including soft deletion}
            writesPerMinute: {type: integer, minimum: 1, description: Fixed UTC minute bucket per account}
            writesPerMonth: {type: integer, minimum: 1, description: UTC calendar month per account}
        jev:
          type: object
          required: [eligible, available, monthlyBudgetUsd, period, rollover]
          properties:
            eligible: {type: boolean, description: Max-only entitlement}
            available: {type: boolean, description: Eligibility and current activation gates both passed}
            monthlyBudgetUsd: {type: string, pattern: '^[0-9]+(\.[0-9]{1,6})?$'}
            period: {type: string, enum: [utc-calendar-month]}
            rollover: {type: boolean, const: false}
    Repository:
      type: object
      required: [githubRepoId, fullName]
      properties:
        githubRepoId: {type: integer, minimum: 1}
        fullName: {type: string}
    RepositoryPage:
      type: object
      required: [items, nextCursor, githubAccess]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/Repository'}}
        nextCursor: {type: [string, 'null']}
        githubAccess:
          type: string
          enum: [authorized, not_connected, lost, reauthorization_required]
          description: Reauthorization requires an explicit GitHub login; expired/revoked credentials never revoke the Pullwise session or write on a GET. Unavailable/unknown grants return an error rather than a successful empty page.
    Target:
      oneOf:
        - {type: object, required: [kind, projectId], additionalProperties: false, properties: {kind: {const: project}, projectId: {type: string}}}
        - {type: object, required: [kind], additionalProperties: false, properties: {kind: {const: shared}}}
    ProjectInput:
      type: object
      required: [githubRepoId]
      properties:
        githubRepoId: {type: integer, minimum: 1}
        description: {type: string, maxLength: 2000}
    ProjectPatch:
      type: object
      properties:
        description: {type: string, maxLength: 2000}
        status: {type: string, enum: [active, archived]}
    Project:
      type: object
      required: [id, githubRepoId, description, status, githubAccess, revision, totals]
      properties:
        id: {type: string}
        githubRepoId: {type: integer, minimum: 1}
        githubFullName: {type: [string, 'null'], description: Null whenever current GitHub authorization cannot be verified; owner history remains available}
        description: {type: string}
        status: {type: string, enum: [active, archived]}
        githubAccess: {type: string, enum: [authorized, lost, reauthorization_required, unavailable]}
        revision: {type: integer, minimum: 1}
        totals: {type: array, items: {$ref: '#/components/schemas/MoneyTotal'}}
    ProjectPage:
      type: object
      required: [items, nextCursor]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/Project'}}
        nextCursor: {type: [string, 'null']}
    CategoryInput:
      type: object
      required: [name]
      properties:
        name: {type: string, minLength: 1, maxLength: 80}
        color: {type: [string, 'null'], maxLength: 32}
    Category:
      type: object
      required: [id, name, revision, archivedAt]
      properties:
        id: {type: string}
        name: {type: string}
        color: {type: [string, 'null']}
        revision: {type: integer, minimum: 1}
        archivedAt: {type: [string, 'null'], format: date-time}
    ExpenseInput:
      type: object
      required: [target, occurredOn, amount, currency, purpose]
      properties:
        target: {$ref: '#/components/schemas/Target'}
        occurredOn: {type: string, format: date}
        amount: {type: string, pattern: '^(0|[1-9][0-9]*)(\.[0-9]+)?$', description: Currency exponent and safe integer bound enforced by server}
        currency: {type: string, pattern: '^[A-Z]{3}$'}
        categoryId: {type: [string, 'null'], description: Required for Free/Pro. Omit on Max create to select a confident existing category automatically; unavailable or uncertain inference returns CATEGORY_REQUIRED. An explicit nonempty value is always preserved.}
        purpose: {type: string, minLength: 1, maxLength: 500}
        note: {type: [string, 'null'], maxLength: 4000}
        quantity: {type: [string, 'null'], pattern: '^(0|[1-9][0-9]*)(\.[0-9]+)?$'}
        unit: {type: [string, 'null'], maxLength: 40}
    ExpensePatchInput:
      allOf:
        - {$ref: '#/components/schemas/ExpenseInput'}
        - {type: object, required: [categoryId], properties: {categoryId: {type: string, minLength: 1}}}
    ExpenseAssistance:
      type: object
      required: [status, suggestions, categorySource]
      properties:
        status: {type: string, enum: [available, uncertain, unavailable]}
        reason: {type: string, description: Provider configuration or daily/monthly budget fallback code; advisory only}
        categorySource: {type: [string, 'null'], enum: [user, jev, null]}
        suggestionId: {type: string}
        questionVersion: {type: string}
        modelVersion: {type: [string, 'null']}
        suggestions:
          type: object
          properties:
            categoryId: {type: string, description: Confident existing category; only assigned on create when caller omits categoryId}
            targetKind: {type: string, enum: [project, shared], description: Advice only; never moves an expense}
            duplicateExpenseId: {type: string, description: Matching active expense on the same authorized target, currency and amount within seven days; advisory only}
        probabilities: {type: object}
    Expense:
      allOf:
        - {$ref: '#/components/schemas/ExpenseInput'}
        - {type: object, required: [id, categoryId, amountMinor, revision, createdAt, updatedAt], properties: {id: {type: string}, categoryId: {type: string, minLength: 1}, amountMinor: {type: integer, minimum: 0, maximum: 9007199254740991}, revision: {type: integer, minimum: 1}, createdAt: {type: string, format: date-time}, updatedAt: {type: string, format: date-time}, assistance: {$ref: '#/components/schemas/ExpenseAssistance'}}}
    ExpensePage:
      type: object
      required: [items, nextCursor]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/Expense'}}
        nextCursor: {type: [string, 'null']}
    MoneyTotal:
      type: object
      required: [currency, amountMinor]
      properties:
        currency: {type: string, pattern: '^[A-Z]{3}$'}
        amountMinor: {$ref: '#/components/schemas/AggregateMinor'}
    AggregateMinor:
      description: Exact total in minor currency units. Totals above the JSON safe integer bound use a decimal integer string; clients must not convert those strings to floating point.
      oneOf:
        - {type: integer, minimum: 0, maximum: 9007199254740991}
        - {type: string, pattern: '^[0-9]+$'}
    Report:
      type: object
      required: [groups]
      properties:
        groups:
          type: array
          items:
            type: object
            required: [currency, amountMinor]
            properties:
              target: {type: [string, 'null'], enum: [project, shared, account, null]}
              projectId: {type: [string, 'null']}
              categoryId: {type: [string, 'null']}
              bucket: {type: [string, 'null']}
              currency: {type: string}
              amountMinor: {$ref: '#/components/schemas/AggregateMinor'}
