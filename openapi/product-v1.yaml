openapi: 3.1.0
info:
  title: Pullwise PR CI Updates API
  version: 1.4.0-p1
  description: Shared REST contract for Web sessions and restricted API keys.
  x-pullwise-scopes:
    - profile:read
    - repositories:read
    - repositories:manage
    - items:read
    - items:write
    - sync:write
    - watches:read
    - watches:write
    - usage:read
servers:
  - url: /
security:
  - cookieSession: []
  - apiKey: []
paths:
  /api/v1/me:
    get:
      operationId: getCurrentProductUser
      responses:
        '200':
          description: Current user identity and available product modules.
  /api/v1/items/overview:
    get:
      operationId: getProductOverview
      parameters:
        - $ref: '#/components/parameters/Module'
        - $ref: '#/components/parameters/RepositoryId'
        - $ref: '#/components/parameters/WatchId'
        - $ref: '#/components/parameters/View'
      responses:
        '200':
          description: Item counts and source coverage for the authorized scope.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Overview' }
  /api/v1/visualizations:
    get:
      operationId: getProductVisualization
      description: Read-only saved Item distributions and PR action rows; never schedules model work or charges usage.
      parameters:
        - name: kind
          in: query
          required: true
          schema: { type: string, enum: [workload, pr_actions, ci_failures, updates_releases] }
        - $ref: '#/components/parameters/Module'
        - $ref: '#/components/parameters/RepositoryId'
        - $ref: '#/components/parameters/WatchId'
        - $ref: '#/components/parameters/View'
        - $ref: '#/components/parameters/Cursor'
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
        - name: releaseId
          in: query
          schema: { type: string }
        - name: relevance
          in: query
          schema: { type: string, enum: [relevant, not_relevant, unclear] }
        - name: updateSignal
          in: query
          schema: { type: string, enum: [migration_stated, deprecation_stated, breaking_change_stated, security_fix_stated] }
        - name: processingStatus
          in: query
          schema: { type: string }
        - name: ciStage
          in: query
          schema: { type: string, enum: [dependency_install, build, test, deploy, runtime, unknown] }
        - name: ciSymptom
          in: query
          schema: { type: string, enum: [connection_timeout, name_resolution_failure, authentication_denied, authorization_denied, assertion_failure, syntax_or_type_error, package_resolution_failure, resource_exhausted, configuration_error] }
        - name: classificationState
          in: query
          schema: { type: string, enum: [identified, unclassified] }
      responses:
        '200':
          description: Distinct current Items in the requested typed visualization.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/WorkloadVisualization'
                  - $ref: '#/components/schemas/PRActionsVisualization'
                  - $ref: '#/components/schemas/CIFailuresVisualization'
                  - $ref: '#/components/schemas/UpdatesReleaseVisualization'
                discriminator:
                  propertyName: kind
  /api/v1/sources:
    get:
      operationId: listSources
      parameters:
        - $ref: '#/components/parameters/Module'
        - $ref: '#/components/parameters/RepositoryId'
        - $ref: '#/components/parameters/WatchId'
        - $ref: '#/components/parameters/Cursor'
        - name: relevance
          in: query
          schema: { type: string, enum: [relevant, not_relevant, unclear] }
          description: Updates only; matches the current watch-context projection.
        - name: updateSignal
          in: query
          schema: { type: string, enum: [migration_stated, deprecation_stated, breaking_change_stated, security_fix_stated] }
          description: Updates only; requires a present signal in the same relevant change unit.
      responses:
        '200':
          description: Authorized source records, including Updates records without Items.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/Source' }
  /api/v1/sources/{sourceId}:
    get:
      operationId: getSource
      parameters:
        - $ref: '#/components/parameters/SourceId'
      responses:
        '200':
          description: Current authorized source and its context-specific status.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Source' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/items:
    get:
      operationId: listItems
      parameters:
        - $ref: '#/components/parameters/Module'
        - $ref: '#/components/parameters/RepositoryId'
        - $ref: '#/components/parameters/WatchId'
        - $ref: '#/components/parameters/View'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Deduplicated current Items for the authorized scope.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Page'
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: '#/components/schemas/Item' }
  /api/v1/items/{itemId}:
    get:
      operationId: getItem
      parameters:
        - $ref: '#/components/parameters/ItemId'
      responses:
        '200':
          description: Current Item, evidence, assessments and handling history.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Item' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      operationId: updateItemHandling
      parameters:
        - $ref: '#/components/parameters/ItemId'
        - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/HandlingPatch' }
      responses:
        '200':
          description: Updated handling projection and appended audit event.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Item' }
        '409': { $ref: '#/components/responses/Conflict' }
        '412': { $ref: '#/components/responses/PreconditionFailed' }
  /api/v1/items/{itemId}/timeline:
    get:
      operationId: getItemTimeline
      description: Saved authorized source observations, assessments and handling events only; never schedules model work.
      parameters:
        - $ref: '#/components/parameters/ItemId'
        - $ref: '#/components/parameters/Cursor'
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        '200':
          description: Events and verified relations with explicit time basis and history coverage.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ItemTimeline' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/repositories:
    get:
      operationId: listRepositoryServices
      responses:
        '200':
          description: Authorized repository service configurations.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Page' }
    post:
      operationId: createRepositoryService
      responses:
        '201': { description: Repository service enabled. }
  /api/v1/repositories/{repositoryId}/service:
    get:
      operationId: getRepositoryService
      parameters:
        - $ref: '#/components/parameters/RepositoryIdPath'
      responses:
        '200': { description: Repository service configuration. }
    put:
      operationId: updateRepositoryService
      parameters:
        - $ref: '#/components/parameters/RepositoryIdPath'
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '200': { description: Repository service updated. }
  /api/v1/repositories/{repositoryId}/sync:
    post:
      operationId: syncRepository
      description: >
        Performs bounded GitHub fact synchronization only and never schedules model work.
        The request body must be an empty object and active jobs are deduplicated.
      parameters:
        - $ref: '#/components/parameters/RepositoryIdPath'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false }
      responses:
        '202':
          description: Fact synchronization accepted or reused.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SyncJob' }
  /api/v1/watches:
    get:
      operationId: listUpdateWatches
      responses:
        '200':
          description: Authorized personal and shared update watches.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Page' }
    post:
      operationId: createUpdateWatch
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WatchInput' }
      responses:
        '201': { description: Watch created. }
  /api/v1/watches/{watchId}:
    patch:
      operationId: updateUpdateWatch
      parameters:
        - $ref: '#/components/parameters/WatchIdPath'
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '200': { description: Watch updated. }
    delete:
      operationId: archiveUpdateWatch
      parameters:
        - $ref: '#/components/parameters/WatchIdPath'
        - $ref: '#/components/parameters/IfMatch'
      responses:
        '204': { description: Watch archived; stable control and usage identity retained. }
  /api/v1/watches/{watchId}/sync:
    post:
      operationId: syncWatch
      description: >
        Performs bounded GitHub Release fact synchronization only and never schedules model work.
        New material waits for normal scheduled eligibility review.
      parameters:
        - $ref: '#/components/parameters/WatchIdPath'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: false }
      responses:
        '202':
          description: Fact synchronization accepted or reused.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SyncJob' }
  /api/v1/usage:
    get:
      operationId: getProductUsage
      responses:
        '200':
          description: Current account entitlements, successful processing, and owner runtime attempts.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Usage' }
  /api/v1/usage/events:
    get:
      operationId: listUsageEvents
      parameters:
        - $ref: '#/components/parameters/Module'
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/UsageLimit'
      responses:
        '200':
          description: Paginated successful-processing ledger for the current account.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UsageEventPage' }
  /api/v1/jobs/{jobId}:
    get:
      operationId: getRequestedSyncJob
      parameters:
        - name: jobId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: The authenticated requester's fact-sync job only.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SyncJob' }
        '404': { $ref: '#/components/responses/NotFound' }
components:
  securitySchemes:
    cookieSession:
      type: apiKey
      in: cookie
      name: pw_session
    apiKey:
      type: apiKey
      in: header
      name: X-Pullwise-Api-Key
  parameters:
    Module:
      name: module
      in: query
      schema: { type: string, enum: [pr, ci, updates] }
    RepositoryId:
      name: repositoryId
      in: query
      schema: { type: string }
    RepositoryIdPath:
      name: repositoryId
      in: path
      required: true
      schema: { type: string }
    WatchId:
      name: watchId
      in: query
      schema: { type: string }
    WatchIdPath:
      name: watchId
      in: path
      required: true
      schema: { type: string }
    SourceId:
      name: sourceId
      in: path
      required: true
      schema: { type: string }
    ItemId:
      name: itemId
      in: path
      required: true
      schema: { type: string }
    View:
      name: view
      in: query
      schema: { type: string, enum: [mine, unassigned, waiting, all] }
    Cursor:
      name: cursor
      in: query
      schema: { type: string }
    UsageLimit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
    IfMatch:
      name: If-Match
      in: header
      required: true
      schema: { type: string }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: { type: string, minLength: 1, maxLength: 128 }
  schemas:
    ItemTimeline:
      type: object
      additionalProperties: false
      required: [items, relations, nextCursor, hasMore, coverage, requestId]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/TimelineEvent' }
        relations: { type: array, items: { type: object } }
        nextCursor: { type: [string, 'null'] }
        hasMore: { type: boolean }
        coverage:
          type: object
          additionalProperties: false
          required: [historicalStartAt, limitations]
          properties:
            historicalStartAt: { type: [string, 'null'], format: date-time }
            limitations: { type: array, items: { type: string } }
        requestId: { type: string }
    TimelineEvent:
      type: object
      additionalProperties: false
      required: [id, itemId, itemVersion, sourceKind, eventType, occurredAt, observedAt, timeBasis, sourceRefs, evidenceIds, actor]
      properties:
        id: { type: string }
        itemId: { type: string }
        itemVersion: { type: integer, minimum: 1 }
        sourceKind: { type: string, enum: [github, model, handling] }
        eventType: { type: string, enum: [snapshot_observed, assessed, disposition_changed, assignee_changed, feedback_changed, disposition_carried_forward] }
        occurredAt: { type: [string, 'null'], format: date-time }
        observedAt: { type: string, format: date-time }
        timeBasis: { type: string, enum: [source, observed] }
        sourceRefs: { type: array, items: { type: object } }
        evidenceIds: { type: array, items: { type: string } }
        actor: { type: [object, 'null'] }
    UpdatesReleaseVisualization:
      type: object
      additionalProperties: false
      required: [kind, scope, generatedAt, lastSyncedAt, countUnit, totalCount, coverage, data, nextCursor, hasMore, requestId]
      properties:
        kind: { type: string, const: updates_releases }
        scope: { type: object, additionalProperties: { type: string } }
        generatedAt: { type: string, format: date-time }
        lastSyncedAt: { type: [string, 'null'], format: date-time }
        countUnit: { type: string, const: release_watch }
        totalCount: { type: integer, minimum: 0 }
        coverage: { $ref: '#/components/schemas/VisualizationCoverage' }
        data:
          type: object
          additionalProperties: false
          required: [rows, columns]
          properties:
            columns:
              type: array
              items:
                type: object
                additionalProperties: false
                required: [key]
                properties:
                  key: { type: string, enum: [migration_stated, deprecation_stated, breaking_change_stated, security_fix_stated] }
            rows:
              type: array
              items: { $ref: '#/components/schemas/UpdatesReleaseRow' }
        nextCursor: { type: [string, 'null'] }
        hasMore: { type: boolean }
        requestId: { type: string }
    UpdatesReleaseRow:
      type: object
      additionalProperties: false
      required: [sourceId, contextId, watchId, upstreamRepositoryId, releaseId, tagName, title, publishedAt, sourceUrl, itemId, contextVersion, processingStatus, contextStale, coverage, relevance, updateSignals, evidenceIds, signalEvidenceIds, drilldown]
      properties:
        sourceId: { type: string }
        contextId: { type: string }
        watchId: { type: string }
        upstreamRepositoryId: { type: [string, 'null'] }
        releaseId: { type: string }
        tagName: { type: [string, 'null'] }
        title: { type: [string, 'null'] }
        publishedAt: { type: [string, 'null'], format: date-time }
        sourceUrl: { type: [string, 'null'] }
        itemId: { type: [string, 'null'] }
        contextVersion: { type: integer, minimum: 1 }
        processingStatus: { type: string }
        contextStale: { type: boolean }
        coverage: { $ref: '#/components/schemas/Coverage' }
        relevance: { type: [string, 'null'], enum: [relevant, not_relevant, unclear, null] }
        updateSignals:
          type: object
          additionalProperties: false
          required: [migration_stated, deprecation_stated, breaking_change_stated, security_fix_stated]
          properties:
            migration_stated: { type: [string, 'null'], enum: [present, absent, unclear, null] }
            deprecation_stated: { type: [string, 'null'], enum: [present, absent, unclear, null] }
            breaking_change_stated: { type: [string, 'null'], enum: [present, absent, unclear, null] }
            security_fix_stated: { type: [string, 'null'], enum: [present, absent, unclear, null] }
        evidenceIds: { type: array, items: { type: string } }
        signalEvidenceIds:
          type: object
          additionalProperties:
            type: array
            items: { type: string }
        drilldown:
          type: object
          additionalProperties: false
          required: [resource, filters]
          properties:
            resource: { type: string, const: sources }
            filters: { type: object, additionalProperties: { type: string } }
    CIFailuresVisualization:
      type: object
      additionalProperties: false
      required: [kind, scope, generatedAt, lastSyncedAt, countUnit, totalCount, coverage, data, nextCursor, hasMore, requestId]
      properties:
        kind: { type: string, const: ci_failures }
        scope: { type: object, additionalProperties: { type: string } }
        generatedAt: { type: string, format: date-time }
        lastSyncedAt: { type: [string, 'null'], format: date-time }
        countUnit: { type: string, const: ci_job_attempt }
        totalCount: { type: integer, minimum: 0 }
        coverage: { $ref: '#/components/schemas/VisualizationCoverage' }
        data:
          type: object
          additionalProperties: false
          required: [rows, columns, cells, unclassifiedCount, unclassifiedDrilldown]
          properties:
            rows:
              type: array
              items:
                type: object
                additionalProperties: false
                required: [key]
                properties:
                  key: { type: string, enum: [dependency_install, build, test, deploy, runtime, unknown] }
            columns:
              type: array
              items:
                type: object
                additionalProperties: false
                required: [key]
                properties:
                  key: { type: string, enum: [connection_timeout, name_resolution_failure, authentication_denied, authorization_denied, assertion_failure, syntax_or_type_error, package_resolution_failure, resource_exhausted, configuration_error] }
            cells:
              type: array
              items:
                type: object
                additionalProperties: false
                required: [rowKey, columnKey, count, drilldown]
                properties:
                  rowKey: { type: string }
                  columnKey: { type: string }
                  count: { type: integer, minimum: 0 }
                  drilldown:
                    type: object
                    additionalProperties: false
                    required: [resource, filters]
                    properties:
                      resource: { type: string, const: items }
                      filters: { type: object, additionalProperties: { type: string } }
            unclassifiedCount: { type: integer, minimum: 0 }
            unclassifiedDrilldown: { type: [object, 'null'] }
        nextCursor: { type: 'null' }
        hasMore: { type: boolean, const: false }
        requestId: { type: string }
    PRActionsVisualization:
      type: object
      additionalProperties: false
      required: [kind, scope, generatedAt, lastSyncedAt, countUnit, totalCount, coverage, data, nextCursor, hasMore, requestId]
      properties:
        kind: { type: string, const: pr_actions }
        scope: { type: object, additionalProperties: { type: string } }
        generatedAt: { type: string, format: date-time }
        lastSyncedAt: { type: [string, 'null'], format: date-time }
        countUnit: { type: string, const: item }
        totalCount: { type: integer, minimum: 0 }
        coverage: { $ref: '#/components/schemas/VisualizationCoverage' }
        data:
          type: object
          additionalProperties: false
          required: [rowsTotal, columns, rows]
          properties:
            rowsTotal: { type: integer, minimum: 0 }
            columns:
              type: array
              items:
                type: object
                additionalProperties: false
                required: [key]
                properties:
                  key: { type: string, enum: [change_requested, reply_needed, review_requested, optional_suggestion, confirm_next_step] }
            rows:
              type: array
              items:
                type: object
                additionalProperties: false
                required: [key, repositoryId, pullNumber, totalCount, cells]
                properties:
                  key: { type: string }
                  repositoryId: { type: string }
                  pullNumber: { type: integer, minimum: 1 }
                  totalCount: { type: integer, minimum: 0 }
                  cells:
                    type: array
                    items: { $ref: '#/components/schemas/VisualizationCell' }
        nextCursor: { type: [string, 'null'] }
        hasMore: { type: boolean }
        requestId: { type: string }
    VisualizationCell:
      type: object
      additionalProperties: false
      required: [key, count, drilldown]
      properties:
        key: { type: string }
        count: { type: integer, minimum: 0 }
        drilldown:
          type: object
          additionalProperties: false
          required: [resource, filters]
          properties:
            resource: { type: string, const: items }
            filters: { type: object, additionalProperties: { type: string } }
    VisualizationCoverage:
      type: object
      additionalProperties: false
      required: [syncState, analysisState, limitations]
      properties:
        syncState: { type: string, enum: [complete, partial, stale, unavailable] }
        analysisState: { type: string, enum: [complete, partial, disabled, unavailable] }
        limitations: { type: array, items: { type: string } }
    WorkloadVisualization:
      type: object
      additionalProperties: false
      required: [kind, scope, generatedAt, lastSyncedAt, countUnit, totalCount, coverage, data, nextCursor, hasMore, requestId]
      properties:
        kind: { type: string, const: workload }
        scope: { type: object, additionalProperties: { type: string } }
        generatedAt: { type: string, format: date-time }
        lastSyncedAt: { type: [string, 'null'], format: date-time }
        countUnit: { type: string, const: item }
        totalCount: { type: integer, minimum: 0 }
        coverage: { $ref: '#/components/schemas/VisualizationCoverage' }
        data:
          type: object
          additionalProperties: false
          required: [columns, rows]
          properties:
            columns:
              type: array
              items:
                type: object
                additionalProperties: false
                required: [key]
                properties:
                  key: { type: string, enum: [needs_action, needs_confirmation, waiting, optional, closed] }
            rows:
              type: array
              items:
                type: object
                additionalProperties: false
                required: [key, totalCount, cells]
                properties:
                  key: { type: string, enum: [pr, ci, updates] }
                  totalCount: { type: integer, minimum: 0 }
                  cells:
                    type: array
                    items:
                      type: object
                      additionalProperties: false
                      required: [key, count, drilldown]
                      properties:
                        key: { type: string, enum: [needs_action, needs_confirmation, waiting, optional, closed] }
                        count: { type: integer, minimum: 0 }
                        drilldown:
                          type: object
                          additionalProperties: false
                          required: [resource, filters]
                          properties:
                            resource: { type: string, const: items }
                            filters: { type: object, additionalProperties: { type: string } }
        nextCursor: { type: 'null' }
        hasMore: { type: boolean, const: false }
        requestId: { type: string }
    Page:
      type: object
      additionalProperties: false
      required: [items, nextCursor, hasMore, requestId]
      properties:
        items: { type: array, items: {} }
        nextCursor: { type: [string, 'null'] }
        hasMore: { type: boolean }
        requestId: { type: string }
    Coverage:
      type: object
      additionalProperties: false
      required: [state, selectedUnits, rawSourcePartial, limitations]
      properties:
        state: { type: string, enum: [complete, partial, unavailable] }
        totalUnits: { type: [integer, 'null'], minimum: 0 }
        selectedUnits: { type: integer, minimum: 0 }
        omittedUnits: { type: [integer, 'null'], minimum: 0 }
        rawSourcePartial: { type: boolean }
        selectionRuleVersion: { type: [string, 'null'] }
        limitations: { type: array, items: { type: string } }
    SourceContext:
      type: object
      additionalProperties: false
      required: [id, contextVersion, processingStatus, analysisEnabled, contextStale, coverage]
      properties:
        id: { type: string }
        watchId: { type: [string, 'null'] }
        targetRepositoryId: { type: [string, 'null'], description: Shared watch target; never the upstream repository. }
        itemId: { type: [string, 'null'] }
        contextVersion: { type: integer, minimum: 1 }
        processingStatus:
          type: string
          enum: [rules_only, pending, processing, assessed, analysis_disabled, paused_quota, provider_unavailable, needs_manual, failed, throttled, not_scheduled]
        pauseReason: { type: [string, 'null'], enum: [processing_quota, owner_provider_budget, global_provider_budget, null] }
        analysisEnabled: { type: boolean }
        contextStale: { type: boolean }
        coverage: { $ref: '#/components/schemas/Coverage' }
        relevance: { type: [string, 'null'], enum: [relevant, not_relevant, unclear, null] }
        updateSignals:
          type: object
          additionalProperties: false
          properties:
            migration_stated: { type: [string, 'null'], enum: [present, absent, unclear, null] }
            deprecation_stated: { type: [string, 'null'], enum: [present, absent, unclear, null] }
            breaking_change_stated: { type: [string, 'null'], enum: [present, absent, unclear, null] }
            security_fix_stated: { type: [string, 'null'], enum: [present, absent, unclear, null] }
        units:
          type: array
          description: Current saved change-unit judgments and evidence references; empty when unclassified.
          items:
            type: object
            additionalProperties: false
            required: [changeUnitId, evidenceIds, relevance, updateSignals]
            properties:
              changeUnitId: { type: string }
              evidenceIds: { type: array, items: { type: string } }
              relevance: { type: string, enum: [relevant, not_relevant, unclear] }
              updateSignals:
                type: object
                additionalProperties: { type: [string, 'null'] }
        assessments: { type: array, items: { $ref: '#/components/schemas/Assessment' }, description: Current context-bound saved results; detail only. }
        evidence: { type: array, items: { $ref: '#/components/schemas/Evidence' }, description: Current assessment evidence; detail only. }
    Source:
      type: object
      additionalProperties: false
      required: [id, type, sourceVersion, sourceRevision, processingMode, completeness, sourceFacts, sourceUrl, updatedAt, lastSyncedAt, contexts]
      properties:
        id: { type: string }
        type: { type: string, enum: [pr_state, pr_review_body, pr_review_comment, pr_comment, ci_failure, release] }
        repositoryId: { type: [string, 'null'] }
        content: { type: object, description: Current saved source material; detail only. }
        sourceVersion: { type: string }
        sourceRevision: { type: integer, minimum: 1 }
        processingMode: { type: string, enum: [rules_only, model] }
        completeness: { type: string, enum: [complete, partial, unavailable] }
        sourceFacts: { type: object }
        sourceUrl: { type: string, format: uri }
        updatedAt: { type: string, format: date-time }
        lastSyncedAt: { type: string, format: date-time }
        contexts:
          type: array
          items: { $ref: '#/components/schemas/SourceContext' }
    Evidence:
      type: object
      additionalProperties: false
      required: [id, sourceId, sourceVersion, status, text, actionTypes]
      properties:
        id: { type: string }
        sourceId: { type: string }
        sourceVersion: { type: string }
        status: { type: string, enum: [available, expired, permission_unavailable] }
        text: { type: [string, 'null'] }
        segmentAnchor: { type: [string, 'null'] }
        actionTypes: { type: array, items: { type: string } }
        progressType:
          type: string
          enum: [completion_claim]
          description: Saved model classification of progress; never technical completion or an action label.
    AssessmentBinding:
      type: object
      required: [evidenceIds]
      additionalProperties: true
      properties:
        sourceId: { type: string }
        sourceVersion: { type: string }
        segmentAnchor: { type: string }
        windowId: { type: string }
        changeUnitId: { type: string }
        contextVersion: { type: integer, minimum: 1 }
        evidenceIds: { type: array, uniqueItems: true, items: { type: string } }
    Assessment:
      type: object
      additionalProperties: false
      required: [id, sourceId, sourceVersion, evidenceIds, questionVersion, extractorVersion, model, contextHash, evaluatedContextVersion, publishContextVersion, dependencies, bindings, answers, usage, status]
      properties:
        id: { type: string }
        sourceId: { type: string }
        sourceVersion: { type: string }
        evidenceIds: { type: array, uniqueItems: true, items: { type: string } }
        questionVersion: { type: string }
        extractorVersion: { type: string }
        model: { type: string }
        contextHash: { type: string }
        evaluatedContextVersion: { type: integer, minimum: 1 }
        publishContextVersion: { type: integer, minimum: 1 }
        dependencies: { type: array, items: { type: object } }
        bindings:
          type: object
          additionalProperties: { $ref: '#/components/schemas/AssessmentBinding' }
        answers: { type: object }
        usage: { type: object }
        status: { type: string, enum: [succeeded] }
    Item:
      type: object
      additionalProperties: false
      required: [id, module, unit, itemVersion, sources, actionTypes, evidence, assessments, lifecycle, attentionState, handling, revision]
      properties:
        id: { type: string }
        module: { type: string, enum: [pr, ci, updates] }
        repositoryId: { type: [string, 'null'] }
        watchId: { type: [string, 'null'] }
        title: { type: string }
        sourceUrl: { type: [string, 'null'], format: uri }
        sourceFacts: { type: object, description: Saved GitHub facts for the handling unit. }
        nextActors:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [kind, githubId]
            properties:
              kind: { type: string, enum: [user, team] }
              githubId: { type: string }
        attentionUpdatedAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        lastSyncedAt: { type: string, format: date-time }
        unit:
          type: object
          additionalProperties: false
          required: [type, externalId]
          properties:
            type: { type: string, enum: [pr_thread, pr_comment, pr_review_body, pr_review_request, ci_job, update_release] }
            externalId: { type: string }
        itemVersion: { type: integer, minimum: 1 }
        sources: { type: array, items: { type: object } }
        actionTypes: { type: array, items: { type: string, enum: [change_requested, reply_needed, review_requested, optional_suggestion, confirm_next_step, investigate_failure, review_update] } }
        evidence: { type: array, items: { $ref: '#/components/schemas/Evidence' } }
        assessments: { type: array, items: { $ref: '#/components/schemas/Assessment' } }
        lifecycle: { type: string, enum: [active, source_closed, source_deleted, superseded] }
        attentionState: { type: string, enum: [needs_action, waiting, optional, needs_confirmation, closed] }
        recoveryStatus: { type: string, enum: [unknown, not_observed, verified] }
        closureReason: { type: [string, 'null'] }
        handlingHistory: { type: array, description: Append-only records in insertion order; detail only., items: { $ref: '#/components/schemas/HandlingEvent' } }
        handling: { $ref: '#/components/schemas/Handling' }
        revision: { type: integer, minimum: 1 }
    HandlingEvent:
      type: object
      additionalProperties: false
      required: [id, itemId, itemVersion, actorId, disposition, assigneeId, note, feedback, eventKind, carriedFromItemVersion, createdAt]
      properties:
        id: { type: string }
        itemId: { type: string }
        itemVersion: { type: integer, minimum: 1 }
        actorId: { type: string }
        disposition: { type: string, enum: [open, done, dismissed] }
        assigneeId: { type: [string, 'null'] }
        note: { type: [string, 'null'] }
        feedback: { type: [string, 'null'], enum: [classification_inaccurate, null] }
        eventKind: { type: string }
        carriedFromItemVersion: { type: [integer, 'null'] }
        createdAt: { type: integer, description: Unix timestamp in seconds. }
    Handling:
      type: object
      additionalProperties: false
      required: [disposition, assigneeId, note, feedback, carriedFromItemVersion]
      properties:
        disposition: { type: string, enum: [open, done, dismissed] }
        assigneeId: { type: [string, 'null'] }
        note: { type: [string, 'null'], maxLength: 2048 }
        feedback: { type: [string, 'null'], enum: [classification_inaccurate, null] }
        carriedFromItemVersion: { type: [integer, 'null'], minimum: 1 }
    HandlingPatch:
      type: object
      additionalProperties: false
      required: [itemVersion]
      properties:
        itemVersion: { type: integer, minimum: 1 }
        disposition: { type: string, enum: [open, done, dismissed] }
        assigneeId: { type: [string, 'null'] }
        note: { type: [string, 'null'], maxLength: 2048 }
        feedback: { type: [string, 'null'], enum: [classification_inaccurate, null] }
    Overview:
      type: object
      additionalProperties: false
      required: [scope, totalCount, counts, viewCounts, sourceCoverage, lastSyncedAt, requestId]
      properties:
        scope: { type: object }
        totalCount: { type: integer, minimum: 0 }
        counts: { type: object }
        viewCounts: { type: object }
        sourceCoverage: { type: object }
        lastSyncedAt: { type: [string, 'null'], format: date-time }
        requestId: { type: string }
    WatchInput:
      type: object
      additionalProperties: false
      required: [upstream, interests]
      properties:
        upstream:
          type: object
          additionalProperties: false
          required: [owner, repository]
          properties:
            owner: { type: string }
            repository: { type: string }
        targetRepositoryId: { type: [string, 'null'] }
        interests: { type: array, items: { type: string }, minItems: 1 }
        includePrerelease: { type: boolean, default: false }
        analysisEnabled: { type: boolean, default: false }
        enabled: { type: boolean, default: true }
    SyncJob:
      type: object
      additionalProperties: false
      required: [id, operation, status, links]
      properties:
        id: { type: string }
        operation: { type: string, enum: [sync_repository, sync_watch] }
        status: { type: string, enum: [queued, running, retry_wait, succeeded, failed, cancelled] }
        links: { type: object }
    Usage:
      type: object
      additionalProperties: false
      required: [service, plan, entitlements, usage, runtimeUsage]
      properties:
        service: { const: github_followups }
        plan: { type: string, enum: [free, pro, max] }
        entitlements: { type: object }
        usage: { type: object }
        runtimeUsage: { type: object }
    UsageEvent:
      type: object
      additionalProperties: false
      required: [id, metric, module, period, processedAt]
      properties:
        id: { type: string, description: Opaque reservation identifier; not a charge key. }
        metric: { const: intelligent_processing }
        module: { type: string, enum: [pr, ci, updates] }
        period: { type: string }
        processedAt: { type: string, format: date-time }
    UsageEventPage:
      type: object
      additionalProperties: false
      required: [items, nextCursor, hasMore, requestId]
      properties:
        items: { type: array, items: { $ref: '#/components/schemas/UsageEvent' } }
        nextCursor: { type: [string, 'null'] }
        hasMore: { type: boolean }
        requestId: { type: string }
    Error:
      type: object
      additionalProperties: false
      required: [error, requestId]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [code, message, retryable]
          properties:
            code: { type: string }
            message: { type: string }
            retryable: { type: boolean }
        requestId: { type: string }
  responses:
    NotFound:
      description: Resource does not exist or is outside the current authorization scope.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Conflict:
      description: Source or Item version conflict.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    PreconditionFailed:
      description: If-Match revision conflict.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
