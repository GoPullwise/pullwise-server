name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: pullwise-server
    steps:
      - uses: actions/checkout@v4
        with:
          path: pullwise-server
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10.12"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade "pip>=25.3,<26" setuptools wheel
          python -m pip install -e ".[deployment]"
          python -m pip install \
            pytest \
            "pip-audit>=2.10.1,<2.11"
      - name: Audit Python dependencies
        run: pip-audit .
      - name: Check Python dependency compatibility
        run: python -m pip check
      - name: Check shell scripts
        run: |
          bash -n ./scripts/deploy-cloudflare.sh
          python ./scripts/check-ledger-s01.py --allow-placeholders
          python ./cloudflare/server/sync_server_modules.py
          python ./cloudflare/server/sync_server_modules.py --check
      - name: Run tests
        run: python -m pytest tests
