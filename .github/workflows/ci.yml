name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: pullwise-server
    steps:
      - uses: actions/checkout@v4
        with:
          path: pullwise-server
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10.12"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade "pip>=25.3,<26" setuptools wheel
          python -m pip install -e .
          python -m pip install \
            pytest \
            "pip-audit>=2.10.1,<2.11" \
            "filelock>=3.20.3,<4"
      - name: Audit Python dependencies
        run: pip-audit .
      - name: Check Python dependency compatibility
        run: python -m pip check
      - name: Check shell scripts
        run: |
          bash -n ./launcher.sh
          bash -n ./git-watch.sh
          bash -n ./ops/configure_api_proxy.sh
      - name: Run tests
        run: |
          python -m pytest \
            tests/test_cloudflare_*.py \
            tests/test_product_*.py \
            tests/test_billing_*.py \
            tests/test_creem_*.py \
            tests/test_github_authorization_contracts.py \
            tests/test_source_context_filters.py \
            tests/test_security_contracts.py \
            tests/test_api_security_extensions.py \
            tests/test_github_auth_contracts.py
