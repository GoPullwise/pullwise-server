name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: pullwise-server
    steps:
      - uses: actions/checkout@v4
        with:
          path: pullwise-server
          persist-credentials: false
      - name: Check out the Worker used by Gateway integration
        uses: actions/checkout@v4
        with:
          repository: GoPullwise/pullwise-worker
          ref: 4cd3ad9dd0bb2e29c3080f39255ccf4050ff09b6
          path: pullwise-worker
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.1"
      - name: Install the frozen Worker runtime graph
        working-directory: pullwise-worker
        run: npm ci --ignore-scripts
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10.12"
      - name: Check current Node.js/Pi Reviewer target
        run: python scripts/check_current_reviewer_authority.py
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade "pip>=25.3,<26" setuptools wheel
          python -m pip install -e .
          python -m pip install \
            pytest \
            "pip-audit>=2.10.1,<2.11" \
            "filelock>=3.20.3,<4"
      - name: Audit Python dependencies
        run: pip-audit .
      - name: Check Python dependency compatibility
        run: python -m pip check
      - name: Check shell scripts
        run: |
          bash -n ./launcher.sh
          bash -n ./git-watch.sh
          bash -n ./ops/configure_api_proxy.sh
      - name: Run tests
        run: python -m pytest
